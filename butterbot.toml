# Local Butterbot configuration, read by the VS Code launch configurations.
# Reference: docs/configuration.md and docs/providers.md.
#
# The resource group and the 15 wildcard certificates are carried over from
# Foundation.Azure.CertManager (appsettings.json), under the same certificate
# names. The vault is a new one, kv-keywarden: it does not hold the
# certificates that service issued, so the first run issues every certificate.

# Secrets come from this vault, and the ACME account is registered and saved
# to it on the first run (secret acme--letsencrypt--access-key). Sign in with
# `az login` first.
[secrets]
key_vault_url = "https://kv-keywarden.vault.azure.net/"

# --- ACME server ------------------------------------------------------------

# Let's Encrypt production, as before. The defaults match the old service:
# renewal 30 days before expiry, RSA 2048 keys.
[acme.letsencrypt]
directory_url = "https://acme-v02.api.letsencrypt.org/directory"

# --- DNS providers ----------------------------------------------------------

# Signs in with the Azure identity; no secret.
# UNVERIFIED: the old service used the default subscription of its identity
# and never named it. This ID is the one the FlairFindr infrastructure files
# use; confirm that it holds RG-Infrastructure.
[dns.azure]
type = "azure-dns"
subscription_id = "8e3e349f-900b-40bc-9916-ec90ca6b2792"
resource_group = "RG-Infrastructure"

# The OpenBreach zones. The API token is the vault secret
# dns--cloudflare--access-key (Zone:Read and DNS:Edit on those zones).
[dns.cloudflare]
type = "cloudflare"

# --- Stores -----------------------------------------------------------------

# PFX, as the old service stored them.
[store.vault]
type = "azure-key-vault"
vault_url = "https://kv-keywarden.vault.azure.net/"

# Adding "local" to the stores of a certificate that the vault already holds
# makes that certificate due at once, because this store does not hold it.
# Relative to the working directory; git ignores it.
[store.local]
type = "directory"
path = "certificates"

# --- Certificates -----------------------------------------------------------

[[certificate]]
name = "wildcard-flairfindr-com"
names = ["*.flairfindr.com", "flairfindr.com"]
acme = "letsencrypt"
dns = "azure"
stores = ["vault"]

